<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lostify</title>

    <meta name="referrer" content="no-referrer-when-downgrade">
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root{
            --amethyst:#9966cc;
            --amethyst-dark:#6a3dad;
            --lemon:#fffacd;
        }

        *{
            box-sizing:border-box;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        }

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#6a3dad,#9966cc);
            padding:20px;
        }

        .card{
            width:100%;
            max-width:400px;
            background:rgba(255,250,205,0.96);
            padding:40px;
            border-radius:18px;
            box-shadow:0 25px 60px rgba(0,0,0,0.3);
            text-align:center;
            position:relative;
            z-index:1;
        }

        .logo{
            font-size:28px;
            font-weight:700;
            color:#6a3dad;
            margin-bottom:8px;
        }

        .subtitle{
            color:#444;
            font-size:14px;
            margin-bottom:25px;
        }

        form{
            margin:0;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:10px;
            border:1px solid #ddd;
            font-size:14px;
            outline:none;
            background:#fff;
        }

        input:focus{
            border-color:#9966cc;
        }

        .login-btn{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:#9966cc;
            color:white;
            font-size:15px;
            cursor:pointer;
            transition:0.25s;
        }

        .login-btn:hover{
            background:#6a3dad;
        }

        .divider{
            margin:20px 0 16px;
            font-size:13px;
            color:#666;
        }

        .google-wrap{
            display:flex;
            justify-content:center;
            margin-top:8px;
        }

        .signup-text{
            margin-top:18px;
            font-size:14px;
            color:#444;
        }

        .signup-text a{
            color:#6a3dad;
            font-weight:600;
            text-decoration:none;
        }

        .signup-text a:hover{
            text-decoration:underline;
        }

        .error-box{
            margin-top:14px;
            color:#c62828;
            font-size:14px;
            min-height:20px;
        }

        .success-box{
            margin-top:14px;
            color:#2e7d32;
            font-size:14px;
            min-height:20px;
        }

        .loading-overlay{
            position:fixed;
            inset:0;
            background:rgba(255,255,255,0.18);
            backdrop-filter:blur(6px);
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            z-index:9999;
            opacity:0;
            visibility:hidden;
            transition:0.25s ease;
        }

        .loading-overlay.show{
            opacity:1;
            visibility:visible;
        }

        .apple-spinner{
            width:55px;
            height:55px;
            border:4px solid rgba(255,255,255,0.35);
            border-top:4px solid white;
            border-radius:50%;
            animation:spin 0.8s linear infinite;
            box-shadow:0 8px 30px rgba(0,0,0,0.2);
        }

        .loading-text{
            margin-top:16px;
            color:white;
            font-size:15px;
            font-weight:600;
            letter-spacing:0.3px;
        }

        @keyframes spin{
            0%{ transform:rotate(0deg); }
            100%{ transform:rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">Welcome</div>
    <div class="subtitle">Sign in to continue</div>

    <form method="post" id="loginForm">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="login-btn">Login</button>
    </form>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="divider">or</div>

    <div id="g_id_onload"
         data-client_id="744893062918-ea0q0rvoasofupumu9tdd0c19k9kjmnv.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>

    <div class="google-wrap">
        <div class="g_id_signin"
             data-type="standard"
             data-size="large"
             data-theme="outline"
             data-text="signin_with"
             data-shape="rectangular"
             data-logo_alignment="left"
             data-width="300">
        </div>
    </div>

    <div class="error-box" id="errorBox"></div>
    <div class="success-box" id="successBox"></div>

    <div class="signup-text">
        Don’t have an account? <a href="/register/">Create Account</a>
    </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
    <div class="apple-spinner"></div>
    <div class="loading-text" id="loadingText">Signing in...</div>
</div>

<script>
const loadingOverlay = document.getElementById("loadingOverlay");
const loadingText = document.getElementById("loadingText");
const loginForm = document.getElementById("loginForm");
const errorBox = document.getElementById("errorBox");
const successBox = document.getElementById("successBox");

function showLoader(text = "Please wait...") {
    loadingText.innerText = text;
    loadingOverlay.classList.add("show");
}

function hideLoader() {
    loadingOverlay.classList.remove("show");
}

loginForm.addEventListener("submit", function() {
    showLoader("Signing in...");
});

function handleCredentialResponse(response) {
    console.log("Google callback fired");
    console.log(response);

    errorBox.innerText = "";
    successBox.innerText = "";
    showLoader("Signing in with Google...");

    fetch("/google-login/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        credentials: "same-origin",
        body: JSON.stringify({
            credential: response.credential
        })
    })
    .then(async res => {
        const data = await res.json();
        console.log("Backend response:", res.status, data);
        return { ok: res.ok, status: res.status, data };
    })
    .then(({ ok, data }) => {
        if (ok && data.success) {
            successBox.innerText = "Login successful. Redirecting...";
            window.location.href = "/";
        } else {
            hideLoader();
            errorBox.innerText = data.error || "Google login failed";
        }
    })
    .catch(error => {
        hideLoader();
        console.error("Fetch error:", error);
        errorBox.innerText = "Something went wrong";
    });
}

window.handleCredentialResponse = handleCredentialResponse;
</script>

</body>
</html>
